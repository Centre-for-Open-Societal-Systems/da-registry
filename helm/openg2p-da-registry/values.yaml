global:
  registryVariant: da-registry
  registryHostname: ''
  aweDefaultCallbackUrl: http://{{ .Release.Name }}-staff-portal-api.{{ .Release.Namespace }}.svc.cluster.local/awe/webhooks/decision
  postgresqlHost: commons-postgresql.commons.svc.cluster.local
  registryDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  registryDBPort: 5432
  registryDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}-db-user'
  masterDataDB: master_data
  masterDataDBPort: 5432
  masterDataDBUser: master_data_user
  masterDataDBSecret: master-data
  masterDataDBUserPasswordKey: master-data-db-user
  baseDomain: development.oanstaging.com
  keycloakBaseUrl: https://keycloak.development.oanstaging.com
  keycloakRealm: staff
  keycloakIssuerUrl: https://keycloak.development.oanstaging.com/realms/staff
  keycloakInternalUrl: http://commons-keycloak.commons.svc.cluster.local:80
  keycloakExternalIssuerUrl: https://keycloak.development.oanstaging.com/realms/staff
  masterDataTokenUrl: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
  minioHost: minio-farmer.development.oanstaging.com
  minioSecure: true
  iamServiceUrl: http://commons-services-iam-staff-portal-api.commons.svc.cluster.local
  masterDataApiUrl: http://commons-services-master-data-api.commons.svc.cluster.local
  partnerManagementApiUrl: http://commons-services-pm-partner-api.commons.svc.cluster.local
  partnerManagementAdminApiUrl: http://commons-services-pm-staff-portal-api.commons.svc.cluster.local
  consentManagerUrl: http://commons-services-cm-partner-api.commons.svc.cluster.local
  consentManagerStaffUrl: http://commons-services-cm-api.commons.svc.cluster.local
  auditManagerUrl: http://commons-services-auditmanager.commons.svc.cluster.local:80
  aweHostname: awe.development.oanstaging.com
  aweBaseUrl: http://commons-services-awe.commons.svc.cluster.local
  idGeneratorInternalUrl: http://{{ .Release.Name }}-id-generator.{{ .Release.Namespace }}.svc.cluster.local/v1
  idGeneratorApiUrl: http://{{ .Release.Name }}-id-generator.{{ .Release.Namespace }}.svc.cluster.local/v1
  notificationEnabled: false
  notificationApiHostname: ''
  notificationWsHostname: ''
  notificationBackendUrl: ''
  notificationWebsocketUrl: ''
  notificationProviderUrl: ''
  idGeneratorHostname: ''
  staffPortalBaseUrl: ''
registry:
  staffApi:
    envVars:
      REGISTRY_STAFF_PORTAL_API_APPLICATION_REFERENCE_FORMAT: '{DATE:%Y%b%d|upper}-{SECONDS:5}-{RAND:4}'
      REGISTRY_STAFF_PORTAL_API_AUTH_REDIS_URL: redis://commons-redis-master.commons.svc.cluster.local:6379/0
      REGISTRY_CORE_REGISTRANT_AUTH_REDIS_URL: redis://commons-redis-master.commons.svc.cluster.local:6379/0
      REGISTRY_STAFF_PORTAL_API_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_API_URL: http://commons-services-master-data-api.commons.svc.cluster.local
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_TOKEN_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
      REGISTRY_STAFF_PORTAL_API_PARTNER_MGMT_API_URL: http://commons-services-pm-partner-api.commons.svc.cluster.local
      REGISTRY_STAFF_PORTAL_API_PARTNER_MGMT_ADMIN_API_URL: http://commons-services-pm-staff-portal-api.commons.svc.cluster.local
      REGISTRY_STAFF_PORTAL_API_PARTNER_MGMT_ADMIN_TOKEN_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
      REGISTRY_STAFF_PORTAL_API_AWE_BASE_URL: http://commons-services-awe.commons.svc.cluster.local
      REGISTRY_STAFF_PORTAL_API_AWE_DEFAULT_CALLBACK_URL: http://{{ .Release.Name }}-staff-portal-api.{{
        .Release.Namespace }}.svc.cluster.local/awe/webhooks/decision
      REGISTRY_STAFF_PORTAL_API_AUDIT_MANAGER_URL: http://commons-services-auditmanager.commons.svc.cluster.local:80
      COMMON_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
      NOTIFICATION_ENABLED: 'false'
      NOTIFICATION_PROVIDER_URL: ''
      KEYCLOAK_BASE_URL: https://keycloak.development.oanstaging.com
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
      REGISTRY_CORE_MASTER_DATA_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
    image:
      repository: ''
      tag: ''
    enabled: false
    istio:
      virtualservice:
        gateway: istio-system/development
  partnerApi:
    envVars:
      REGISTRY_PARTNER_API_APPLICATION_REFERENCE_FORMAT: '{DATE:%Y%b%d|upper}-{SECONDS:5}-{RAND:4}'
      REGISTRY_PARTNER_API_DCI_EXPRESSION_ALLOWED_FIELDS: '["functional_record_id","first_name","middle_name","last_name","given_name","gender","birth_date","foundational_id","record_name","record_status","search_text","marital_status","income_level","education_level","residency_status","disability_status","displacement_status","region_name","zone_name","woreda_name","kebele_name","geo_lowest_level_value_id","position","specialisation","upstream_reference"]'
      REGISTRY_PARTNER_API_KEYMANAGER_API_BASE_URL: http://commons-services-keymanager.commons.svc.cluster.local/v1/keymanager
      REGISTRY_PARTNER_API_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
      REGISTRY_PARTNER_API_MASTER_DATA_API_URL: http://commons-services-master-data-api.commons.svc.cluster.local
      REGISTRY_PARTNER_API_MASTER_DATA_TOKEN_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
      REGISTRY_PARTNER_API_PARTNER_MGMT_API_URL: http://commons-services-pm-partner-api.commons.svc.cluster.local
      REGISTRY_PARTNER_API_PARTNER_MGMT_ADMIN_API_URL: http://commons-services-pm-staff-portal-api.commons.svc.cluster.local
      REGISTRY_PARTNER_API_PARTNER_MGMT_ADMIN_TOKEN_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
      REGISTRY_PARTNER_API_AUDIT_MANAGER_URL: http://commons-services-auditmanager.commons.svc.cluster.local:80
      COMMON_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
      NOTIFICATION_ENABLED: 'false'
      NOTIFICATION_PROVIDER_URL: ''
      KEYCLOAK_BASE_URL: https://keycloak.development.oanstaging.com
      REGISTRY_PARTNER_API_MASTER_DATA_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
    image:
      repository: ''
      tag: ''
    enabled: false
    istio:
      virtualservice:
        gateway: istio-system/development
  celeryWorker:
    envVars:
      REGISTRY_CELERY_WORKERS_APPLICATION_REFERENCE_FORMAT: '{DATE:%Y%b%d|upper}-{SECONDS:5}-{RAND:4}'
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PORT: '{{ .Values.global.masterDataDBPort }}'
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_DBNAME: '{{ tpl .Values.global.masterDataDB $ }}'
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_USERNAME: '{{ tpl .Values.global.masterDataDBUser $ }}'
      REGISTRY_CELERY_WORKERS_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
      REGISTRY_CELERY_WORKERS_MASTER_DATA_API_URL: http://commons-services-master-data-api.commons.svc.cluster.local
      REGISTRY_CELERY_WORKERS_MASTER_DATA_TOKEN_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
      REGISTRY_CELERY_WORKERS_PARTNER_MGMT_API_URL: http://commons-services-pm-partner-api.commons.svc.cluster.local
      REGISTRY_CELERY_WORKERS_PARTNER_MGMT_ADMIN_API_URL: http://commons-services-pm-staff-portal-api.commons.svc.cluster.local
      REGISTRY_CELERY_WORKERS_PARTNER_MGMT_ADMIN_TOKEN_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
      REGISTRY_CELERY_WORKERS_AWE_BASE_URL: http://commons-services-awe.commons.svc.cluster.local
      REGISTRY_CELERY_WORKERS_AWE_DEFAULT_CALLBACK_URL: http://{{ .Release.Name }}-staff-portal-api.{{
        .Release.Namespace }}.svc.cluster.local/awe/webhooks/decision
      REGISTRY_CELERY_WORKERS_AWE_TOKEN_ISSUER_BASE_URL: https://keycloak.development.oanstaging.com
      REGISTRY_CELERY_WORKERS_AWE_TOKEN_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
      COMMON_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
      NOTIFICATION_ENABLED: 'false'
      NOTIFICATION_PROVIDER_URL: ''
    envVarsFrom:
      REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PASSWORD:
        secretKeyRef:
          name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
          key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
    image:
      repository: ''
      tag: ''
    enabled: false
  celeryBeat:
    image:
      repository: ''
      tag: ''
    enabled: false
    envVars:
      COMMON_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
      NOTIFICATION_ENABLED: 'false'
      NOTIFICATION_PROVIDER_URL: ''
      REGISTRY_CELERY_BEAT_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
      REGISTRY_CELERY_BEAT_MASTER_DATA_DB_HOSTNAME: commons-postgresql.commons.svc.cluster.local
  dbSeed:
    image:
      repository: ''
      tag: ''
    loadSampleData: false
    loadImages: false
    loadTemplates: true
    enabled: false
  iamRegister:
    applicationDescription: DA Registry
    enabled: false
  idgenerator:
    idGenerator:
      appConfig:
        idTypes:
          da:
            idLength: 10
      hostname: '{{ tpl .Values.global.idGeneratorHostname $ }}'
      istio:
        virtualservice:
          host: '{{ tpl .Values.global.idGeneratorHostname $ }}'
          gateway: istio-system/development
        gateway:
          host: '{{ tpl .Values.global.idGeneratorHostname $ }}'
    enabled: false
    postgres-init:
      postgresql:
        host: commons-postgresql.commons.svc.cluster.local
  sanity:
    enabled: false
  staffUi:
    image:
      repository: ''
      tag: ''
    enabled: false
    iamPublicUrl: https://staff-iam.development.oanstaging.com
    envVars:
      COOKIE_DOMAIN: .development.oanstaging.com
      IAM_URL: https://staff-iam.development.oanstaging.com
      KEYCLOAK_LOGOUT_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/logout
      NOTIFICATION_BACKEND_URL: ''
      NOTIFICATION_WEBSOCKET_URL: ''
    istio:
      virtualservice:
        gateway: istio-system/development
  postgres-init:
    enabled: false
    postgresql:
      host: commons-postgresql.commons.svc.cluster.local
  keycloak-init:
    enabled: false
    keycloak:
      url: http://commons-keycloak.commons.svc.cluster.local:80
  redis:
    enabled: false
  beneApi:
    istio:
      virtualservice:
        gateway: istio-system/development
dashboardUi:
  enabled: false
  nameOverride: ''
  image:
    repository: ''
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 1
  containerPort: 3000
  servicePort: 80
  env: []
  envFrom: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
dashboardApi:
  enabled: false
  nameOverride: ''
  image:
    repository: ''
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 1
  containerPort: 8000
  servicePort: 80
  env: []
  envFrom: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
