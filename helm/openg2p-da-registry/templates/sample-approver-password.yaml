{{- /*
  Sample approvers (alex.carter, nina.patel by default) sign in with registry.global.aweApproverUserPassword.

  The platform's keycloak-init creates them with that password as a temporary one and never updates an
  existing user, so without this a fresh install needs a hand password reset and a changed value never
  applies. This hook makes the declared password permanent for the listed users only, after every install
  and upgrade (files/sample-approver-password.py). An empty password, or sampleApproverPassword.enabled
  false, renders nothing.
*/ -}}
{{- $c := .Values.sampleApproverPassword | default dict -}}
{{- $platform := .Values.registry | default dict -}}
{{- $password := (($platform.global | default dict).aweApproverUserPassword | default "" | toString) -}}
{{- $kc := (index $platform "keycloak-init" | default dict).keycloak | default dict -}}
{{- if and $c.enabled $password $c.users }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-sample-approver-password
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sample-approver-password
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "45"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  password: {{ $password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-sample-approver-password
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sample-approver-password
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "45"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  set_password.py: |
{{ .Files.Get "files/sample-approver-password.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-sample-approver-password
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sample-approver-password
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "50"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ add (int ($c.waitSeconds | default 600)) 300 }}
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with $c.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: set-password
          image: {{ $c.image | default "python:3.11.14-slim" | quote }}
          command: [python, -B, /job/set_password.py]
          env:
            - { name: KEYCLOAK_URL, value: {{ tpl ($kc.url | default "http://commons-keycloak.commons.svc.cluster.local:80") $ | quote }} }
            - { name: KEYCLOAK_USER, value: {{ $kc.user | default "admin" | quote }} }
            - name: KEYCLOAK_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ tpl ($kc.existingSecret | default "commons-keycloak") $ | quote }}, key: {{ $kc.existingSecretKey | default "admin-password" | quote }} } }
            - { name: REALM, value: {{ $c.realm | default "staff" | quote }} }
            - { name: USERS, value: {{ $c.users | toJson | quote }} }
            - { name: WAIT_SECONDS, value: {{ $c.waitSeconds | default 600 | quote }} }
            - name: APPROVER_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ printf "%s-sample-approver-password" .Release.Name | quote }}, key: password } }
          volumeMounts:
            - { name: job, mountPath: /job, readOnly: true }
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: job
          configMap:
            name: {{ .Release.Name }}-sample-approver-password
            items:
              - { key: set_password.py, path: set_password.py }
{{- end }}
