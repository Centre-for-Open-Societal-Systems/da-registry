{{- /*
ECR pull secret for the registry images, kept by the release itself so the
namespace needs no manual setup. ECR tokens expire after 12 hours:
  - a pre-install/pre-upgrade hook Job writes the secret before the pod is
    created or rolled, so the first deploy can pull. Hook weights sit below every
    other hook of this chart (lowest -12) and of the openg2p-registry subchart
    (lowest 10), so db-seed and the other hooks can pull images too;
  - a CronJob refreshes it on ecrPullSecret.schedule.
Both fetch the token with the node's IAM role and write only the one secret
named by ecrPullSecret.name (default <release>-ecr-pull-secret) and, when
ecrPullSecret.serviceAccounts is set, patch only those ServiceAccounts to list it.
*/ -}}
{{- if .Values.ecrPullSecret.enabled }}
{{- $name := include "registryEcr.refresher" . }}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation" }}
{{- range $i, $mode := list "hook" "release" }}
{{- $isHook := eq $mode "hook" }}
{{- $objName := ternary (printf "%s-init" $name) $name $isHook }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $objName }}
  labels:
    {{- include "registryEcr.labels" $ | nindent 4 }}
  {{- if $isHook }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-30") $hook) | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $objName }}
  labels:
    {{- include "registryEcr.labels" $ | nindent 4 }}
  {{- if $isHook }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-30") $hook) | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "registryEcr.secretName" $ | quote }}]
    verbs: ["get", "update", "patch"]
  {{- with $.Values.ecrPullSecret.serviceAccounts }}
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: {{ toJson . }}
    verbs: ["get", "patch"]
  {{- end }}
  # create cannot be limited by resourceNames; needed the first time only.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $objName }}
  labels:
    {{- include "registryEcr.labels" $ | nindent 4 }}
  {{- if $isHook }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-29") $hook) | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $objName }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $objName }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "registryEcr.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-25") $hook) | nindent 4 }}
spec:
  {{- include "registryEcr.jobSpec" (dict "root" . "serviceAccount" (printf "%s-init" $name)) | nindent 2 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "registryEcr.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.ecrPullSecret.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      {{- include "registryEcr.jobSpec" (dict "root" . "serviceAccount" $name) | nindent 6 }}
{{- end }}
