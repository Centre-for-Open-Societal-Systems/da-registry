# Dev deployment of the DA registry: release `da`, namespace `commons`, chart
# oan-coss/openg2p-da-registry (Centre-for-Open-Societal-Systems/oan-helm).
#
# The Jenkinsfile applies this on every develop build, over the release's own
# values (--reuse-values), and sets each image tag to the commit it built
# (<component>-<12-char sha>). The commons service URLs, Keycloak, MinIO and
# gateway settings come from the chart's dev defaults and are not repeated here.
#
# The oan-helm chart ships every DA workload disabled with empty images; this
# turns them on and points them at the images CI pushes to ECR.

global:
  registryHostname: da-registry.development.oanstaging.com

registry:
  staffApi:
    enabled: true
    envVars:
      # Imports are approved manually (two-level); the approval request is
      # opened with this client's service token (see helm values.yaml).
      DA_AWE_TOKEN_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
      DA_AWE_CLIENT_ID: da-registry-backend
    envVarsFrom:
      DA_AWE_CLIENT_SECRET:
        secretKeyRef:
          # TODO(devops): the secret of the Keycloak client da-registry-backend
          # in realm staff (create the client with service accounts enabled).
          name: da-registry-backend-keycloak
          key: client-secret
          optional: true
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/da-registry
      tag: staff-api-develop
  partnerApi:
    enabled: true
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/da-registry
      tag: partner-api-develop
    envVarsFrom:
      DA_AWE_CLIENT_SECRET:
        secretKeyRef:
          name: da-registry-backend-keycloak
          key: client-secret
          optional: true
    envVars:
      DA_AWE_TOKEN_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
      DA_AWE_CLIENT_ID: da-registry-backend
      # Imports open their approval request from this process, so it needs the
      # AWE settings the chart gives only the staff API.
      REGISTRY_PARTNER_API_AWE_ENABLED: "true"
      REGISTRY_PARTNER_API_AWE_BASE_URL: http://commons-services-awe.commons.svc.cluster.local
      REGISTRY_PARTNER_API_AWE_DEFAULT_CALLBACK_URL: http://{{ .Release.Name }}-staff-portal-api.{{ .Release.Namespace }}.svc.cluster.local/awe/webhooks/decision
      REGISTRY_PARTNER_API_AWE_CALLBACK_SECRET_ID: '{{ tpl .Values.global.aweCallbackSecretId $ }}'
      # Same list as docker-compose.yml: DA location (names and codes), position
      # and last_approved_at, so DA Services can filter by Woreda / Kebele.
      # registry-platform 1.2.2-rc.557 reads DCI_ALLOWED_SEARCH_FIELDS (rc.544: DCI_EXPRESSION_ALLOWED_FIELDS); the old name is ignored and every DA filter field is then "not searchable".
      REGISTRY_PARTNER_API_DCI_ALLOWED_SEARCH_FIELDS: '["functional_record_id","first_name","middle_name","last_name","given_name","gender","birth_date","foundational_id","record_name","record_status","search_text","marital_status","income_level","education_level","residency_status","disability_status","displacement_status","region_name","zone_name","woreda_name","kebele_name","geo_lowest_level_value_id","position","specialisation","upstream_reference","region_code","zone_code","woreda_code","last_approved_at"]'
  celeryWorker:
    enabled: true
    envVars:
      # Imports are approved manually (two-level); the approval request is
      # opened with this client's service token (see helm values.yaml).
      DA_AWE_TOKEN_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
      DA_AWE_CLIENT_ID: da-registry-backend
      # Imports open their approval request from this process, so it needs the
      # AWE settings the chart gives only the staff API.
      REGISTRY_CELERY_WORKERS_AWE_ENABLED: "true"
      REGISTRY_CELERY_WORKERS_AWE_BASE_URL: http://commons-services-awe.commons.svc.cluster.local
      REGISTRY_CELERY_WORKERS_AWE_DEFAULT_CALLBACK_URL: http://{{ .Release.Name }}-staff-portal-api.{{ .Release.Namespace }}.svc.cluster.local/awe/webhooks/decision
      REGISTRY_CELERY_WORKERS_AWE_CALLBACK_SECRET_ID: '{{ tpl .Values.global.aweCallbackSecretId $ }}'
    envVarsFrom:
      DA_AWE_CLIENT_SECRET:
        secretKeyRef:
          # TODO(devops): the secret of the Keycloak client da-registry-backend
          # in realm staff (create the client with service accounts enabled).
          name: da-registry-backend-keycloak
          key: client-secret
          optional: true
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/da-registry
      tag: celery-develop
  celeryBeat:
    enabled: true
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/da-registry
      tag: celery-develop
  staffUi:
    enabled: true
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/da-registry
      tag: staff-ui-develop
  dbSeed:
    enabled: true
    image:
      repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/da-registry
      tag: db-seed-develop
  # What a first install provisions: the registry DB and user, its Keycloak
  # client, its IAM tile and roles, the DA-ID pool and its Celery broker.
  postgres-init:
    enabled: true
  keycloak-init:
    enabled: true
  iamRegister:
    enabled: true
  idgenerator:
    enabled: true
  redis:
    enabled: true
